<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img"><title>06 · Acceso de emergencia (sólo lectura)</title><rect width="1400" height="760" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">06 · Acceso de emergencia (sólo lectura)</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Una segunda cuenta de confianza puede pedir acceso; nada se abre sin un tiempo de espera</text><rect x="50" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Invitar</text><text x="195.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">el dueño invita a una</text><text x="195.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">segunda cuenta de confianza</text><polyline points="340,245 385,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,245 372.7138441335348,251.71195754045885 372.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="385" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Aceptar</text><text x="530.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">el contacto acepta y</text><text x="530.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">crea su cuenta</text><polyline points="675,245 720,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="720,245 707.7138441335347,251.71195754045885 707.7138441335347,238.28804245954115" fill="#C0602B"/><rect x="720" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Confirmar</text><text x="865.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">el dueño verifica la</text><text x="865.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">huella</text><polyline points="1010,245 1055,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1055,245 1042.7138441335348,251.71195754045885 1042.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="1055" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Solicitar</text><text x="1200.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">en una emergencia el</text><text x="1200.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">contacto pide acceso</text><rect x="50" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Esperar</text><text x="195.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">p. ej. 7 días; se avisa</text><text x="195.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">al dueño y puede rechazar</text><polyline points="340,485 385,485" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,485 372.7138441335348,491.71195754045885 372.7138441335348,478.28804245954115" fill="#C0602B"/><rect x="385" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="530.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Sólo lectura</text><text x="530.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">acceso concedido</text><text x="530.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sin tomar la cuenta</text><polyline points="1200,320 1200,360 195,360 195,410" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="195,410 188.28804245954115,397.7138441335348 201.71195754045885,397.7138441335348" fill="#C0602B"/><text x="50" y="680" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#EDF0F4">La espera y los avisos le dan al dueño la chance de decir que no. Sólo lectura evita tomar la cuenta.</text></svg>
