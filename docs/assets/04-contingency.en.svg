<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img"><title>04 · Contingency activation</title><rect width="1400" height="960" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">04 · Contingency activation</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">The primary is lost or unreachable: bring the vault back on the standby</text><rect x="50" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Detect</text><text x="195.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">primary lost or</text><text x="195.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">unreachable</text><polyline points="340,245 385,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,245 372.7138441335348,251.71195754045885 372.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="385" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Connect</text><text x="530.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">to the remote host</text><text x="530.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">on a real terminal</text><polyline points="675,245 720,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="720,245 707.7138441335347,251.71195754045885 707.7138441335347,238.28804245954115" fill="#C0602B"/><rect x="720" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">List and choose</text><text x="865.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">latest archive by</text><text x="865.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">default</text><polyline points="1010,245 1055,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1055,245 1042.7138441335348,251.71195754045885 1042.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="1055" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="1200.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Verify checksum</text><text x="1200.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">damaged or altered</text><text x="1200.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">files are refused</text><polyline points="1200,320 1200,360 195,360 195,410" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="195,410 188.28804245954115,397.7138441335348 201.71195754045885,397.7138441335348" fill="#C0602B"/><rect x="50" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="470.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Type passphrase</text><text x="195.0" y="500.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">not shown, not saved</text><polyline points="340,485 385,485" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,485 372.7138441335348,491.71195754045885 372.7138441335348,478.28804245954115" fill="#C0602B"/><rect x="385" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Integrity check</text><text x="530.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">users and items</text><text x="530.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">counted before replacing</text><polyline points="675,485 720,485" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="720,485 707.7138441335347,491.71195754045885 707.7138441335347,478.28804245954115" fill="#C0602B"/><rect x="720" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="865.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Confirm</text><text x="865.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">type YES; previous data</text><text x="865.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">kept (last 3)</text><polyline points="1010,485 1055,485" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1055,485 1042.7138441335348,491.71195754045885 1042.7138441335348,478.28804245954115" fill="#C0602B"/><rect x="1055" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Start standby</text><text x="1200.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">same image,</text><text x="1200.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">private network</text><rect x="50" y="650" width="1290" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="695.0" y="685.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">After the contingency</text><text x="695.0" y="715.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sign in with master password and second factor; decide: repair or rebuild the primary and restore there</text><text x="695.0" y="745.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">then stop the standby and wipe the restored database; the encrypted archives stay</text><polyline points="1200,560 1200,650" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1200,650 1193.2880424595412,637.7138441335347 1206.7119575404588,637.7138441335347" fill="#C0602B"/><text x="50" y="850" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#EDF0F4">A person types the passphrase on a real terminal; nothing is ever saved or sent by chat.</text></svg>
