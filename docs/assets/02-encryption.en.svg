<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>02 · Encryption layers</title><rect width="1400" height="900" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">02 · Encryption layers</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Four independent protections; losing one does not expose the vault</text><rect x="50" y="170" width="300" height="130" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="200.0" y="220.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">1 · Vault</text><text x="200.0" y="250.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">master password</text><rect x="420" y="170" width="450" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="645.0" y="220.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Client-side encryption</text><text x="645.0" y="250.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Argon2id key derivation</text><polyline points="350,235 420,235" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="420,235 407.7138441335348,241.71195754045885 407.7138441335348,228.28804245954115" fill="#C0602B"/><rect x="50" y="330" width="300" height="130" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="200.0" y="380.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">2 · Login</text><text x="200.0" y="410.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">second factor</text><rect x="420" y="330" width="450" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="645.0" y="380.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Authenticator app + hardware</text><text x="645.0" y="410.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">keys; recovery codes offline</text><polyline points="350,395 420,395" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="420,395 407.7138441335348,401.71195754045885 407.7138441335348,388.28804245954115" fill="#C0602B"/><rect x="50" y="490" width="300" height="130" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="200.0" y="540.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">3 · Backup</text><text x="200.0" y="570.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">separate passphrase</text><rect x="420" y="490" width="450" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="645.0" y="540.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">GnuPG symmetric, AES-256</text><text x="645.0" y="570.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">verified by decrypting</text><polyline points="350,555 420,555" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="420,555 407.7138441335348,561.7119575404588 407.7138441335348,548.2880424595412" fill="#C0602B"/><rect x="50" y="650" width="300" height="130" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="200.0" y="700.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">4 · Transport</text><text x="200.0" y="730.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">restricted SSH key</text><rect x="420" y="650" width="450" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="645.0" y="700.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">SSH forced command</text><text x="645.0" y="730.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">private network path</text><polyline points="350,715 420,715" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="420,715 407.7138441335348,721.7119575404588 407.7138441335348,708.2880424595412" fill="#C0602B"/><rect x="940" y="170" width="410" height="280" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1145.0" y="250.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">What each place can read</text><text x="1145.0" y="280.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Primary server: ciphertext only</text><text x="1145.0" y="310.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Remote VPS: an encrypted archive</text><text x="1145.0" y="340.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Cloud copy (optional): same archive</text><text x="1145.0" y="370.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Network: encrypted traffic</text><rect x="940" y="490" width="410" height="290" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="1145.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Never stored together</text><text x="1145.0" y="605.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">master password</text><text x="1145.0" y="635.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">backup passphrase</text><text x="1145.0" y="665.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">recovery codes</text><text x="1145.0" y="695.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">and the archives themselves</text></svg>
