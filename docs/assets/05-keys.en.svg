<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>05 · Keys needed to recover</title><rect width="1400" height="900" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">05 · Keys needed to recover</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">What each secret is for and what happens without it (categories only, no locations)</text><text x="50" y="140" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#BBC5D4">Secret</text><text x="390" y="140" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#BBC5D4">Needed for</text><text x="850" y="140" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#BBC5D4">If it is lost</text><rect x="50" y="170" width="300" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="212.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Master password</text><text x="200.0" y="242.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">memorised</text><rect x="390" y="170" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="200" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Unlock the vault</text><text x="405" y="232" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">every device, every day</text><text x="405" y="260" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">no recovery by design</text><rect x="850" y="170" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="200" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">No way back into the vault</text><text x="865" y="232" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">the server cannot reset it</text><text x="865" y="260" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">protect the emergency access</text><rect x="50" y="305" width="300" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="347.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Second-factor</text><text x="200.0" y="377.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">recovery codes</text><rect x="390" y="305" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="335" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Sign in if a device is lost</text><text x="405" y="367" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">printed, kept offline</text><text x="405" y="395" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">separate from the devices</text><rect x="850" y="305" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="335" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Locked out of the account</text><text x="865" y="367" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">use another key or the</text><text x="865" y="395" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">emergency contact</text><rect x="50" y="440" width="300" height="115" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="200.0" y="482.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Backup passphrase</text><text x="200.0" y="512.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">≠ master password</text><rect x="390" y="440" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="470" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Open the encrypted archives</text><text x="405" y="502" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">only at restore time</text><text x="405" y="530" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">typed, never stored online</text><rect x="850" y="440" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="470" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Archives become unreadable</text><text x="865" y="502" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">keep an offline copy</text><text x="865" y="530" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">in a different place</text><rect x="50" y="575" width="300" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="617.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Receiver SSH key</text><text x="200.0" y="647.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">on the primary</text><rect x="390" y="575" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="605" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Send archives off-site</text><text x="405" y="637" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">cannot run anything else</text><text x="405" y="665" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">one forced command</text><rect x="850" y="575" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="605" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Replace the key</text><text x="865" y="637" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">nothing else is lost</text><text x="865" y="665" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">the vault is untouched</text></svg>
