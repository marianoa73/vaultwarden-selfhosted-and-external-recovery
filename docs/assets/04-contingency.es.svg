<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img"><title>04 · Activación de la contingencia</title><rect width="1400" height="960" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">04 · Activación de la contingencia</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">El principal se perdió o no responde: se recupera la bóveda en el respaldo</text><rect x="50" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Detectar</text><text x="195.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">el principal se perdió</text><text x="195.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">o no responde</text><polyline points="340,245 385,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,245 372.7138441335348,251.71195754045885 372.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="385" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Conectar</text><text x="530.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">al host remoto, en una</text><text x="530.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">terminal real</text><polyline points="675,245 720,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="720,245 707.7138441335347,251.71195754045885 707.7138441335347,238.28804245954115" fill="#C0602B"/><rect x="720" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Listar y elegir</text><text x="865.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">el archivo más nuevo</text><text x="865.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">por defecto</text><polyline points="1010,245 1055,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1055,245 1042.7138441335348,251.71195754045885 1042.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="1055" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="1200.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Verificar hash</text><text x="1200.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">archivos dañados o</text><text x="1200.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">alterados se rechazan</text><polyline points="1200,320 1200,360 195,360 195,410" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="195,410 188.28804245954115,397.7138441335348 201.71195754045885,397.7138441335348" fill="#C0602B"/><rect x="50" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Tipear la frase</text><text x="195.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">no se muestra ni</text><text x="195.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">se guarda</text><polyline points="340,485 385,485" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,485 372.7138441335348,491.71195754045885 372.7138441335348,478.28804245954115" fill="#C0602B"/><rect x="385" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Chequeo de la base</text><text x="530.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">se cuentan usuarios y</text><text x="530.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">elementos antes de pisar</text><polyline points="675,485 720,485" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="720,485 707.7138441335347,491.71195754045885 707.7138441335347,478.28804245954115" fill="#C0602B"/><rect x="720" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="865.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Confirmar</text><text x="865.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">escribir SI; lo anterior</text><text x="865.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">se conserva (últimas 3)</text><polyline points="1010,485 1055,485" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1055,485 1042.7138441335348,491.71195754045885 1042.7138441335348,478.28804245954115" fill="#C0602B"/><rect x="1055" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Iniciar respaldo</text><text x="1200.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">misma imagen,</text><text x="1200.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">red privada</text><rect x="50" y="650" width="1290" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="695.0" y="685.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Después de la contingencia</text><text x="695.0" y="715.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">ingresar con contraseña maestra y segundo factor; decidir: reparar o reconstruir el principal y restaurar allí</text><text x="695.0" y="745.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">luego apagar el respaldo y borrar la base restaurada; los archivos cifrados quedan</text><polyline points="1200,560 1200,650" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1200,650 1193.2880424595412,637.7138441335347 1206.7119575404588,637.7138441335347" fill="#C0602B"/><text x="50" y="850" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#EDF0F4">Una persona tipea la frase en una terminal real; nunca se guarda ni se envía por chat.</text></svg>
