<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"><title>01 · Overview</title><rect width="1400" height="920" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">01 · Overview</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">A self-hosted password vault, an encrypted copy off-site and a standby that is switched on only in a contingency</text><rect x="50" y="190" width="250" height="140" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="175.0" y="230.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Your devices</text><text x="175.0" y="260.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">phone, computers</text><text x="175.0" y="290.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">official client apps</text><rect x="370" y="190" width="250" height="140" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="495.0" y="230.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Private network</text><text x="495.0" y="260.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">mesh VPN, not exposed</text><text x="495.0" y="290.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">to the internet</text><polyline points="300,260 370,260" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="370,260 357.7138441335348,266.71195754045885 357.7138441335348,253.28804245954115" fill="#C0602B"/><polyline points="620,260 690,260" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="690,260 677.7138441335347,266.71195754045885 677.7138441335347,253.28804245954115" fill="#C0602B"/><rect x="690" y="150" width="660" height="220" rx="20" fill="#171C24" stroke="#C0602B" stroke-width="3"/><text x="1020" y="182" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Primary server (local)</text><rect x="715" y="210" width="290" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="860.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Vaultwarden</text><text x="860.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">container, loopback only</text><text x="860.0" y="305.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sign-ups closed</text><rect x="1035" y="210" width="290" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1180.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Encrypted vault</text><text x="1180.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">items encrypted on</text><text x="1180.0" y="305.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">the device first</text><polyline points="1005,275 1035,275" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1035,275 1022.7138441335347,281.71195754045885 1022.7138441335347,268.28804245954115" fill="#C0602B"/><polyline points="1020,370 1020,470" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1020,470 1013.2880424595412,457.7138441335348 1026.7119575404588,457.7138441335348" fill="#C0602B"/><text x="1210" y="420" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">nightly, encrypted</text><rect x="690" y="470" width="660" height="230" rx="20" fill="#171C24" stroke="#596778" stroke-width="3"/><text x="1020" y="502" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Remote VPS (off-site)</text><rect x="715" y="530" width="290" height="140" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="860.0" y="570.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Encrypted archives</text><text x="860.0" y="600.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">last 14 copies + checksums</text><text x="860.0" y="630.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">cannot be opened here</text><rect x="1035" y="530" width="290" height="140" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1180.0" y="570.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Standby server</text><text x="1180.0" y="600.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">same image, switched OFF</text><text x="1180.0" y="630.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">started on contingency</text><rect x="50" y="470" width="250" height="140" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="175.0" y="510.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Offline papers</text><text x="175.0" y="540.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">recovery codes and</text><text x="175.0" y="570.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">backup passphrase</text><rect x="370" y="470" width="250" height="140" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="495.0" y="510.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Emergency contact</text><text x="495.0" y="540.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">second account,</text><text x="495.0" y="570.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">view-only, with a delay</text><text x="50" y="850" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Nothing is exposed to the internet; no single place holds both the archives and the passphrase.</text></svg>
