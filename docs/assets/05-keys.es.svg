<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>05 · Claves necesarias para recuperar</title><rect width="1400" height="900" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">05 · Claves necesarias para recuperar</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Para qué sirve cada secreto y qué pasa sin él (sólo categorías, sin ubicaciones)</text><text x="50" y="140" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#BBC5D4">Secreto</text><text x="390" y="140" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#BBC5D4">Sirve para</text><text x="850" y="140" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#BBC5D4">Si se pierde</text><rect x="50" y="170" width="300" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="212.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Contraseña maestra</text><text x="200.0" y="242.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">memorizada</text><rect x="390" y="170" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="200" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Abrir la bóveda</text><text x="405" y="232" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">todos los dispositivos</text><text x="405" y="260" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">sin recuperación, a propósito</text><rect x="850" y="170" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="200" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">No hay vuelta atrás</text><text x="865" y="232" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">el servidor no la restablece</text><text x="865" y="260" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">proteger el acceso de emergencia</text><rect x="50" y="305" width="300" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="347.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Códigos de rescate</text><text x="200.0" y="377.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">del segundo factor</text><rect x="390" y="305" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="335" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Ingresar si se pierde un</text><text x="405" y="367" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">dispositivo; impresos y</text><text x="405" y="395" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">guardados offline, aparte</text><rect x="850" y="305" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="335" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Cuenta bloqueada</text><text x="865" y="367" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">usar otra llave o el</text><text x="865" y="395" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">contacto de emergencia</text><rect x="50" y="440" width="300" height="115" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="200.0" y="482.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Frase del backup</text><text x="200.0" y="512.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">≠ contraseña maestra</text><rect x="390" y="440" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="470" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Abrir los archivos cifrados</text><text x="405" y="502" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">sólo al restaurar</text><text x="405" y="530" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">se tipea, nunca online</text><rect x="850" y="440" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="470" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Archivos ilegibles</text><text x="865" y="502" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">guardar una copia offline</text><text x="865" y="530" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">en otro lugar</text><rect x="50" y="575" width="300" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="617.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Clave SSH del envío</text><text x="200.0" y="647.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">en el principal</text><rect x="390" y="575" width="420" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="405" y="605" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Enviar archivos afuera</text><text x="405" y="637" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">no puede ejecutar nada</text><text x="405" y="665" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">más: un comando forzado</text><rect x="850" y="575" width="500" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865" y="605" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Se reemplaza la clave</text><text x="865" y="637" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">no se pierde nada más</text><text x="865" y="665" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#BBC5D4">la bóveda queda intacta</text></svg>
