# STANDBY server: the same file as the primary, started only during a contingency.
# Same pinned image as the primary. It stays STOPPED until the activation procedure starts it.
services:
  vaultwarden:
    image: vaultwarden/server@sha256:REPLACE_WITH_THE_DIGEST_YOU_VERIFIED
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8222:80"
    environment:
      DOMAIN: "https://vault.example.internal"
      SIGNUPS_ALLOWED: "false"          # open only for the minute it takes to create the accounts
      INVITATIONS_ALLOWED: "false"
      EMERGENCY_ACCESS_ALLOWED: "true"
      LOG_LEVEL: "warn"
    volumes:
      - ./data:/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
